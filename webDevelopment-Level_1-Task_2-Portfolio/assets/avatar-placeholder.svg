<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="400" height="400" rx="30" fill="url(#bgGrad)"/>
  
  <!-- Subtle Background Tech Grid / Code motif -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <path d="M 0,100 L 400,100 M 0,200 L 400,200 M 0,300 L 400,300"/>
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400"/>
  </g>

  <!-- Glow Ring -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Inner Background Circle -->
  <circle cx="200" cy="180" r="105" fill="#0F172A" stroke="url(#primaryGrad)" stroke-width="3"/>

  <!-- Developer Silhouette / Avatar Graphic -->
  <!-- Head -->
  <circle cx="200" cy="140" r="45" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  <!-- Shoulder / Torso -->
  <path d="M 115,260 C 115,200 285,200 285,260 L 285,275 C 285,280 280,285 275,285 L 125,285 C 120,285 115,280 115,275 Z" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  
  <!-- Tech Glasses Graphic -->
  <rect x="170" y="132" width="24" height="14" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <rect x="206" y="132" width="24" height="14" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <line x1="194" y1="139" x2="206" y2="139" stroke="#38BDF8" stroke-width="2"/>

  <!-- Laptop Motif at Bottom -->
  <path d="M 130,270 L 270,270 L 285,295 L 115,295 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="150" y="273" width="100" height="18" rx="2" fill="url(#primaryGrad)" opacity="0.9"/>
  <text x="200" y="286" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">&lt;UPASANA /&gt;</text>

  <!-- Floating Tech Pills -->
  <g filter="url(#shadow)">
    <!-- Pill 1: CSE Student -->
    <rect x="30" y="325" width="105" height="34" rx="17" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="82" y="346" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">💻 CSE '29</text>
    
    <!-- Pill 2: Frontend -->
    <rect x="145" y="325" width="110" height="34" rx="17" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="200" y="346" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#C084FC" text-anchor="middle">⚡ Full Stack</text>

    <!-- Pill 3: RCCIIT -->
    <rect x="265" y="325" width="105" height="34" rx="17" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="317" y="346" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FB7185" text-anchor="middle">🎓 RCCIIT</text>
  </g>
</svg><!-- Task 2 Asset -->
