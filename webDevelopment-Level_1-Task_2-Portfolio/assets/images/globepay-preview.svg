<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="globeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#globeBg)"/>
  
  <!-- Globe Grid Circles -->
  <circle cx="300" cy="190" r="130" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.25"/>
  <ellipse cx="300" cy="190" rx="130" ry="50" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.25"/>
  <ellipse cx="300" cy="190" rx="50" ry="130" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.25"/>

  <!-- UI Window Container -->
  <rect x="60" y="50" width="480" height="280" rx="12" fill="#1E293B" stroke="#6366F1" stroke-width="1.5" opacity="0.95"/>
  
  <!-- Window Header -->
  <rect x="60" y="50" width="480" height="36" rx="12" fill="#0F172A"/>
  <circle cx="82" cy="68" r="5" fill="#EF4444"/>
  <circle cx="98" cy="68" r="5" fill="#F59E0B"/>
  <circle cx="114" cy="68" r="5" fill="#10B981"/>
  <text x="300" y="73" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">GlobePay Digital Payment Portal</text>

  <!-- Credit Card Graphic -->
  <rect x="100" y="115" width="220" height="135" rx="12" fill="url(#cardGrad)" opacity="0.95"/>
  <circle cx="140" cy="145" r="12" fill="#FCD34D" opacity="0.8"/>
  <rect x="120" y="180" width="120" height="10" rx="3" fill="#FFFFFF" opacity="0.9"/>
  <text x="120" y="220" fill="#FFFFFF" font-family="Courier New, monospace" font-size="12" font-weight="700">•••• •••• 8842</text>

  <!-- Transaction Overview Card -->
  <rect x="340" y="115" width="160" height="180" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="355" y="140" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Quick Transfer</text>
  <rect x="355" y="155" width="130" height="24" rx="4" fill="#1E293B"/>
  <text x="365" y="171" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11">$ 1,250.00</text>

  <rect x="355" y="190" width="130" height="30" rx="6" fill="#6366F1"/>
  <text x="420" y="210" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Pay Now</text>

  <!-- Transaction items -->
  <circle cx="365" cy="245" r="6" fill="#10B981"/>
  <rect x="380" y="241" width="90" height="8" rx="2" fill="#475569"/>
  <circle cx="365" cy="265" r="6" fill="#38BDF8"/>
  <rect x="380" y="261" width="70" height="8" rx="2" fill="#475569"/>
</svg>