<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="toBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#toBg)"/>
  
  <!-- Optical Grid -->
  <circle cx="300" cy="190" r="130" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.25" stroke-dasharray="6,6"/>
  <circle cx="300" cy="190" r="80" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.4"/>
  <circle cx="300" cy="190" r="35" fill="none" stroke="#EF4444" stroke-width="1.5" opacity="0.7"/>
  <line x1="120" y1="190" x2="480" y2="190" stroke="#38BDF8" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="300" y1="40" x2="300" y2="340" stroke="#38BDF8" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>

  <!-- Main Window -->
  <rect x="45" y="35" width="510" height="310" rx="12" fill="#0F172A" stroke="#0284C7" stroke-width="1.5" opacity="0.95" filter="url(#glow)"/>
  
  <!-- Header HUD -->
  <rect x="45" y="35" width="510" height="38" rx="12" fill="#030712"/>
  <circle cx="68" cy="54" r="5" fill="#EF4444"/>
  <circle cx="84" cy="54" r="5" fill="#F59E0B"/>
  <circle cx="100" cy="54" r="5" fill="#10B981"/>
  <text x="300" y="59" fill="#38BDF8" font-family="Courier New, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">TARGET RETICLE - TRACKOPTIC AI (YOLOv8s)</text>

  <!-- HUD Badges -->
  <rect x="65" y="85" width="95" height="24" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="112" y="101" fill="#10B981" font-family="Courier New, monospace" font-size="11" font-weight="700" text-anchor="middle">30+ FPS LIVE</text>

  <rect x="170" y="85" width="105" height="24" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="222" y="101" fill="#38BDF8" font-family="Courier New, monospace" font-size="11" font-weight="700" text-anchor="middle">LATENCY 34ms</text>

  <rect x="285" y="85" width="120" height="24" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="345" y="101" fill="#F59E0B" font-family="Courier New, monospace" font-size="11" font-weight="700" text-anchor="middle">TRACKS ACTIVE: 4</text>

  <!-- Target Bounding Box 1 -->
  <rect x="160" y="135" width="140" height="160" fill="none" stroke="#10B981" stroke-width="2" rx="4"/>
  <rect x="160" y="117" width="100" height="18" fill="#10B981" rx="2"/>
  <text x="210" y="130" fill="#0F172A" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ID #01 • Person 94%</text>

  <!-- Motion Trail (Kalman Polyline) -->
  <polyline points="210,270 205,250 215,225 230,200 230,175" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>

  <!-- Target Bounding Box 2 -->
  <rect x="340" y="150" width="130" height="130" fill="none" stroke="#38BDF8" stroke-width="2" rx="4"/>
  <rect x="340" y="132" width="105" height="18" fill="#38BDF8" rx="2"/>
  <text x="392" y="145" fill="#0F172A" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ID #02 • Laptop 91%</text>

  <!-- Virtual Laser Tripwire Line -->
  <line x1="65" y1="240" x2="535" y2="240" stroke="url(#laserGrad)" stroke-width="2" filter="url(#glow)"/>
  <rect x="445" y="226" width="90" height="20" rx="3" fill="#EF4444"/>
  <text x="490" y="240" fill="#FFFFFF" font-family="Courier New, monospace" font-size="10" font-weight="700" text-anchor="middle">TRIPWIRE [IN: 12]</text>

  <!-- Bottom Spectrum Controls -->
  <rect x="65" y="310" width="470" height="22" rx="4" fill="#111827"/>
  <text x="300" y="325" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">MODES: [● OPTICAL RGB]  [○ FLIR THERMAL IR]  [○ TACTICAL NVG PHOSPHOR]</text>
</svg>