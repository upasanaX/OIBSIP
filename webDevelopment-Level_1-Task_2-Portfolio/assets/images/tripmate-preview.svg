<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="tripBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="tripAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#tripBg)"/>
  
  <!-- Flight Arc Line -->
  <path d="M80,300 Q300,50 520,300" fill="none" stroke="url(#tripAccent)" stroke-width="2.5" stroke-dasharray="6,6"/>
  <!-- Flight Icon -->
  <g transform="translate(300, 100) rotate(15)">
    <path d="M0,0 L20,-10 L15,0 L30,5 L20,8 L10,5 Z" fill="#F97316"/>
  </g>

  <!-- UI Window Container -->
  <rect x="50" y="45" width="500" height="290" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" opacity="0.95"/>
  
  <!-- Window Header -->
  <rect x="50" y="45" width="500" height="36" rx="12" fill="#0284C7" opacity="0.4"/>
  <circle cx="72" cy="63" r="5" fill="#EF4444"/>
  <circle cx="88" cy="63" r="5" fill="#F59E0B"/>
  <circle cx="104" cy="63" r="5" fill="#10B981"/>
  <text x="300" y="68" fill="#E0F2FE" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">TripMate – Modern Travel Planner</text>

  <!-- Travel Cards Layout -->
  <rect x="75" y="100" width="135" height="210" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="85" y="110" width="115" height="85" rx="6" fill="#0284C7" opacity="0.6"/>
  <text x="95" y="215" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Explore Bali</text>
  <text x="95" y="235" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="11">5 Days • $650</text>
  <rect x="95" y="255" width="95" height="24" rx="12" fill="#F97316"/>
  <text x="142" y="271" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Book Trip</text>

  <rect x="232" y="100" width="135" height="210" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="242" y="110" width="115" height="85" rx="6" fill="#0D9488" opacity="0.6"/>
  <text x="252" y="215" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Swiss Alps</text>
  <text x="252" y="235" fill="#2DD4BF" font-family="Segoe UI, sans-serif" font-size="11">7 Days • $1,200</text>
  <rect x="252" y="255" width="95" height="24" rx="12" fill="#0D9488"/>
  <text x="299" y="271" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Book Trip</text>

  <rect x="389" y="100" width="135" height="210" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="399" y="110" width="115" height="85" rx="6" fill="#8B5CF6" opacity="0.6"/>
  <text x="409" y="215" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Tokyo City</text>
  <text x="409" y="235" fill="#A78BFA" font-family="Segoe UI, sans-serif" font-size="11">6 Days • $980</text>
  <rect x="409" y="255" width="95" height="24" rx="12" fill="#8B5CF6"/>
  <text x="456" y="271" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Book Trip</text>
</svg>
