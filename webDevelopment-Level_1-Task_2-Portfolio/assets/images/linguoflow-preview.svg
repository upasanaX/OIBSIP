<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="lfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1F1D36"/>
      <stop offset="100%" stop-color="#311B92"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="lfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#lfBg)"/>
  <circle cx="480" cy="80" r="130" fill="#8B5CF6" opacity="0.15"/>
  <circle cx="100" cy="280" r="150" fill="#EC4899" opacity="0.12"/>

  <!-- Main Container -->
  <rect x="45" y="35" width="510" height="310" rx="12" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5" opacity="0.95" filter="url(#lfGlow)"/>

  <!-- Header -->
  <rect x="45" y="35" width="510" height="38" rx="12" fill="#0F0E2A"/>
  <circle cx="68" cy="54" r="5" fill="#EF4444"/>
  <circle cx="84" cy="54" r="5" fill="#F59E0B"/>
  <circle cx="100" cy="54" r="5" fill="#10B981"/>
  <text x="300" y="59" fill="#C084FC" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">LinguoFlow PRO &amp; Coursemate AI Suite</text>

  <!-- Left Box: Source Language -->
  <rect x="65" y="90" width="225" height="140" rx="8" fill="#131131" stroke="#4C1D95" stroke-width="1"/>
  <text x="80" y="115" fill="#A78BFA" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">ENGLISH (INPUT)</text>
  <text x="80" y="145" fill="#F3F4F6" font-family="Segoe UI, sans-serif" font-size="12">"Real-time deep learning computer vision delivers immediate insights."</text>
  <rect x="80" y="190" width="95" height="24" rx="4" fill="#312E81"/>
  <text x="127" y="206" fill="#DDD6FE" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Voice Dictation</text>

  <!-- Right Box: Translated Language -->
  <rect x="310" y="90" width="225" height="140" rx="8" fill="#131131" stroke="#8B5CF6" stroke-width="1"/>
  <text x="325" y="115" fill="#F472B6" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">SPANISH • BUSINESS TONE</text>
  <text x="325" y="145" fill="#F3F4F6" font-family="Segoe UI, sans-serif" font-size="12">"La vision artificial de aprendizaje profundo en tiempo real ofrece informacion."</text>
  <rect x="325" y="190" width="130" height="24" rx="4" fill="url(#accentGrad)"/>
  <text x="390" y="206" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Play Spanish Voice</text>

  <!-- Bottom: Coursemate AI & Features -->
  <rect x="65" y="245" width="470" height="85" rx="8" fill="#0F0E2A" stroke="#4C1D95" stroke-width="1"/>
  <text x="80" y="270" fill="#E9D5FF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Coursemate AI (TF-IDF NLP FAQ Engine + Knowledge Base)</text>
  <text x="80" y="292" fill="#9CA3AF" font-family="Segoe UI, sans-serif" font-size="10">NLTK lemmatization • Cosine similarity scoring (0.92 Confidence) • SQLite persistent memory</text>
  <text x="80" y="312" fill="#C084FC" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">4 Tone Adapters: Standard | Casual &amp; Fun | Business &amp; Formal | Poetic &amp; Elegant</text>
</svg>