<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bharatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bharatBg)"/>
  
  <!-- Subtle glowing background circles -->
  <circle cx="300" cy="190" r="140" fill="#10B981" opacity="0.1"/>

  <!-- UI Window Container -->
  <rect x="50" y="45" width="500" height="290" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5" opacity="0.95"/>
  
  <!-- Window Header -->
  <rect x="50" y="45" width="500" height="36" rx="12" fill="#064E3B"/>
  <circle cx="72" cy="63" r="5" fill="#EF4444"/>
  <circle cx="88" cy="63" r="5" fill="#F59E0B"/>
  <circle cx="104" cy="63" r="5" fill="#10B981"/>
  <text x="300" y="68" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Bharat ID – Digital Identity Platform</text>

  <!-- Digital Identity Badge Card -->
  <rect x="90" y="100" width="230" height="210" rx="12" fill="#1E293B" stroke="#059669" stroke-width="1"/>
  <circle cx="150" cy="155" r="30" fill="url(#shieldGrad)"/>
  <!-- User Silhouette -->
  <circle cx="150" cy="148" r="10" fill="#FFFFFF"/>
  <path d="M132,175 C132,165 140,165 150,165 C160,165 168,165 168,175 Z" fill="#FFFFFF"/>

  <text x="195" y="145" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Citizen ID Card</text>
  <text x="195" y="165" fill="#10B981" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">VERIFIED • SECURE</text>

  <rect x="110" y="200" width="190" height="8" rx="4" fill="#334155"/>
  <rect x="110" y="218" width="150" height="8" rx="4" fill="#334155"/>
  
  <!-- QR Code Representation -->
  <rect x="110" y="240" width="50" height="50" rx="4" fill="#10B981" opacity="0.2" stroke="#10B981"/>
  <rect x="116" y="246" width="15" height="15" fill="#10B981"/>
  <rect x="139" y="246" width="15" height="15" fill="#10B981"/>
  <rect x="116" y="269" width="15" height="15" fill="#10B981"/>

  <!-- Service Integration Grid -->
  <rect x="340" y="100" width="170" height="95" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="355" y="125" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Public Services</text>
  <rect x="355" y="140" width="140" height="18" rx="4" fill="#064E3B"/>
  <text x="365" y="153" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="10">DigiLocker Access</text>

  <rect x="340" y="210" width="170" height="100" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="355" y="235" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Cloudflare Workers</text>
  <rect x="355" y="250" width="140" height="18" rx="4" fill="#064E3B"/>
  <text x="365" y="263" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="10">TanStack Start Engine</text>
</svg>
